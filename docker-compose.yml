services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: acme_bids
      POSTGRES_PASSWORD: acme_bids
      POSTGRES_DB: acme_bids
    ports:
      - "5432:5432"
    volumes:
      - acme_bids_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme_bids"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  acme_bids_pgdata:
